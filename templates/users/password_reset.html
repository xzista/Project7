{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Сброс пароля{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-dark text-white">
                    <h4 class="card-title mb-0 text-center">
                        <i class="fas fa-key me-2"></i>Сброс пароля
                    </h4>
                </div>
                <div class="card-body p-4">
                    <p class="text-muted mb-4">
                        Забыли пароль? Введите свой email ниже, и мы вышлем инструкции для его сброса.
                    </p>

                    <form method="post">
                        {% csrf_token %}
                        {{ form|crispy }}
                        <button type="submit" class="btn btn-primary w-100 py-2">
                            <i class="fas fa-paper-plane me-2"></i>Отправить инструкции
                        </button>
                    </form>

                    <div class="text-center mt-4">
                        <a href="{% url 'users:login' %}" class="text-decoration-none">
                            <i class="fas fa-arrow-left me-1"></i>Вернуться ко входу
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
