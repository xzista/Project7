{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Вход в систему{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-dark text-white">
                    <h4 class="card-title mb-0 text-center">
                        <i class="fas fa-sign-in-alt me-2"></i>Вход в систему
                    </h4>
                </div>
                <div class="card-body p-4">
                    <form method="post">
                        {% csrf_token %}
                        {{ form|crispy }}
                        <button type="submit" class="btn btn-primary w-100 py-2">
                            <i class="fas fa-sign-in-alt me-2"></i>Войти
                        </button>
                    </form>

                    <div class="text-center mt-4">
                        <p class="mb-2">Нет аккаунта?
                            <a href="{% url 'users:register' %}" class="text-decoration-none">Зарегистрируйтесь</a>
                        </p>
                        <p class="mb-0">
                            <a href="{% url 'users:password_reset' %}" class="text-decoration-none">
                                <i class="fas fa-key me-1"></i>Забыли пароль?
                            </a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
