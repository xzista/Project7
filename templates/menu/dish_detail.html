{% extends "base.html" %}
{% block title %}{{ dish.name }}{% endblock %}
{% block content %}
<div class="container py-5">
  <div class="row">
    <div class="col-md-6">
      {% if dish.image %}<img src="{{ dish.image.url }}" class="img-fluid rounded" alt="{{ dish.name }}">{% endif %}
    </div>
    <div class="col-md-6">
      <h1>{{ dish.name }}</h1>
      <p class="text-muted">{{ dish.category.name }}</p>
      <h3 class="text-primary">{{ dish.price }}₽</h3>
      <p>{{ dish.description }}</p>
      <a class="btn btn-outline-primary" href="{% url 'bookings:booking_form' %}">Забронировать стол</a>
    </div>
  </div>
</div>
{% endblock %}
